name: odoo-dev

services:

  odoo:
    image: 'dynamist/odoo'
    build:
      context: .
      dockerfile: ./Dockerfile
    init: true
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-odoo}
      - PGPASSWORD=${POSTGRES_PASSWORD:-supersecr3tpassw0rdfordatabase1}
      - PGDATABASE=${ODOO_DB:-odoo}
      # Odoo 19 reads ODOO_<OPTION> env vars natively, this one sets admin_passwd
      - ODOO_ADMIN_PASSWD=${ODOO_MASTER_PASSWORD:-supersecr3tmasterpassw0rdfordevelop1}
      - ODOO_URL=${ODOO_URL:-http://localhost:8069}
      - ODOO_USER=${ODOO_USER:-admin}
      - ODOO_PASSWORD=${ODOO_PASSWORD:-supersecr3tpassw0rdfordevelop1}
      - ODOO_API_KEY=${ODOO_API_KEY:-odoo-supersecr3tapikeyfordevelop1}
      - ODOO_USERS_PASSWORD=${ODOO_USERS_PASSWORD:-supersecr3tpassw0rdfordevelop1}
      - ODOO_MODULES=${ODOO_MODULES:-contacts,crm,sale_management,account,stock,project,hr}
      - ODOO_DEMO_DATA=${ODOO_DEMO_DATA:-true}
    ports:
      - '127.0.0.1:${ODOO_PORT:-8069}:8069'
    volumes:
      - odoo-data:/var/lib/odoo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8069/web/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start installs all apps with demo data
      start_period: 15m

  db:
    image: 'postgres:17'
    environment:
      # Do not pre-create the Odoo database, init-odoo.sh creates it
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGRES_USER:-odoo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-supersecr3tpassw0rdfordatabase1}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
  odoo-data:

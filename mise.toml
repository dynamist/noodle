[tools]
# The pipx backend installs with `uv tool install`
uv = "0.12.15"
"pipx:odooly" = "2.6.6"
k3d = "5.9.0"
# Keep kubectl in lockstep with the k3s image in k8s/cluster/k3d.yaml (max ±1 minor).
# That file is a shared contract -- bump it in dynatron and phabfive at the same time.
kubectl = "1.37.0"
kubeconform = "0.8.0"

[env]
# Connection details of the local Odoo, same defaults as k8s/base
ODOO_URL = "http://odoo.localhost"
ODOO_DB = "odoo"
ODOO_USER = "admin"
ODOO_PASSWORD = "supersecr3tpassw0rdfordevelop1"
ODOO_API_KEY = "odoo-supersecr3tapikeyfordevelop1"
